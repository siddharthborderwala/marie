name: release

# `pnpm release patch|minor|major` bumps the version (package.json,
# src-tauri/tauri.conf.json, src-tauri/Cargo.toml), commits, and pushes a vX.Y.Z tag.
# The tag must match those versions.
#
# Run it by hand (Actions → release → Run workflow) for a dry run: it builds the
# universal app and uploads it as a workflow artifact, publishing nothing. On main it
# also signs (and, with the API key secrets, notarizes) the app; from any other branch
# it's built unsigned, so the signing secrets never reach an unmerged branch.
#
# macOS signing secrets (required for tag builds) — same names as tray:
#   MACOS_CERT_P12       base64 of the Developer ID Application .p12
#   MACOS_CERT_PASSWORD  its password
#   APPLE_TEAM_ID        X3LGKV5NYS
# Notarization: APPLE_API_KEY_ID, APPLE_API_ISSUER_ID, APPLE_API_KEY_P8 (the .p8 contents).
# Updater: TAURI_SIGNING_PRIVATE_KEY (+ optional TAURI_SIGNING_PRIVATE_KEY_PASSWORD) —
# signs the update bundle the app verifies against the pubkey in tauri.conf.json.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"
          test "v$(jq -r .version src-tauri/tauri.conf.json)" = "$GITHUB_REF_NAME"
          grep -q "^version = \"${GITHUB_REF_NAME#v}\"$" src-tauri/Cargo.toml

      - run: pnpm typecheck

      # --- import the Developer ID certificate into a throwaway keychain ---
      # Signing and notarization secrets only for tags and main.
      - name: Import signing certificate
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$MACOS_CERT_P12" ] || [ -z "$MACOS_CERT_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::MACOS_CERT_P12, MACOS_CERT_PASSWORD and APPLE_TEAM_ID must be set to build a signed app"
            exit 1
          fi
          keychain="$RUNNER_TEMP/marie-signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # Runners don't ship Apple's Developer ID intermediate; without it the identity isn't valid.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | grep "Developer ID Application: .*($APPLE_TEAM_ID)" | head -1 | awk '{print $2}')"
          if [ -z "$identity" ]; then
            echo "::error::no valid 'Developer ID Application' identity for team $APPLE_TEAM_ID in MACOS_CERT_P12"
            security find-identity -p codesigning "$keychain" | sed 's/^/  /'
            exit 1
          fi
          # tauri build signs with APPLE_SIGNING_IDENTITY (SHA-1 is unambiguous)
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      # Tauri notarizes + staples the .app itself when these are set.
      - name: Notarization key
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER_ID" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then echo "::error::notarization secrets missing"; exit 1; fi
            echo "Notarization secrets not set; skipping (app is signed, not notarized)."
            exit 0
          fi
          key="$RUNNER_TEMP/notary.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          {
            echo "APPLE_API_KEY=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER_ID"
            echo "APPLE_API_KEY_PATH=$key"
          } >> "$GITHUB_ENV"

      - name: Build universal app (+ updater bundle)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Collect release files
        run: |
          v="$(jq -r .version src-tauri/tauri.conf.json)"
          b=src-tauri/target/universal-apple-darwin/release/bundle
          mkdir -p dist/release
          cp "$b"/dmg/*.dmg "dist/release/Marie_${v}_universal.dmg"
          # Unversioned copy so the website can link to releases/latest/download/Marie.dmg
          cp "$b"/dmg/*.dmg dist/release/Marie.dmg
          cp "$b/macos/Marie.app.tar.gz" "dist/release/Marie_${v}_universal.app.tar.gz"
          cp "$b/macos/Marie.app.tar.gz.sig" "dist/release/Marie_${v}_universal.app.tar.gz.sig"
          # Updater manifest: the universal bundle serves both architectures.
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${v}/Marie_${v}_universal.app.tar.gz"
          sig="$(cat "dist/release/Marie_${v}_universal.app.tar.gz.sig")"
          jq -n --arg v "$v" --arg url "$url" --arg sig "$sig" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{
            version: $v, notes: "See the release page for details.", pub_date: $date,
            platforms: {
              "darwin-aarch64": { url: $url, signature: $sig },
              "darwin-x86_64": { url: $url, signature: $sig }
            }
          }' > dist/release/latest.json

      - name: Delete signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/marie-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/release

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/release
      - name: Checksums
        run: cd dist/release && sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release/*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # v0.2.0-beta.1 and the like are prereleases: never "latest", so the
          # in-app updater (releases/latest/download/latest.json) never offers them.
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft $pre --generate-notes \
            --title "Marie $GITHUB_REF_NAME" dist/release/*
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
