[package]
name = "marie"
version = "0.1.0"
description = "Fast code & diff viewer"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "marie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.6", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
nucleo-matcher = "0.3"
ignore = "0.4"
anyhow = "1"
dirs = "6"
tauri-plugin-opener = "2"
portable-pty = "0.9"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
trash = "5"
tauri-plugin-clipboard-manager = "2"
